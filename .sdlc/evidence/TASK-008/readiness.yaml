    findings:
      - id: TASK-008-READINESS-DNS
        status: UNRESOLVED
        references:
          - .sdlc/design/DCR-002-full-sing-box-subscription-and-compiler.md:87
          - .sdlc/tasks/TASK-008.md:43
          - docs/veyra.md:3005
          - src-tauri/src/domain/state.rs:37
        detail: >-
          DCR-002 requires DNS output to originate from Domain DnsPolicy, but no such code type
          exists and TASK-008 denies Domain changes. The requirement gives a DNS model shape,
          without resolving the ObservationOnly automatic/empty policy or node/probe resolution.
      - id: TASK-008-READINESS-FIXTURE
        status: UNRESOLVED
        references:
          - src-tauri/src/singbox/runtime.rs:392
          - .sdlc/tasks/TASK-008.md:39
        detail: >-
          Existing runtime tests expect the old one-argument compiler to accept a no-pool fixture.
          The tightened contract rejects that fixture; its test-only adaptation is outside scope.allow.
    resolved_observations:
      - >-
        RuntimeIntent omits AppState.default_target. An application-owned internal compilation input
        can preserve the exact persisted target within the existing allowed application files;
        this does not itself require Domain or Storage expansion.
    proposed_change:
      approval_status: PENDING
      scope_additions:
        - >-
          src-tauri/src/domain/state.rs and mod.rs: only a non-persistent, closed typed DNS
          compilation input and its focused tests; no AppState schema or storage changes.
        - >-
          src-tauri/src/singbox/runtime.rs: only compiler fixture adaptation; no production
          lifecycle, check/prepare/run/ready/stop/rollback transaction changes.
      dns_semantics_for_owner_decision: >-
        ObservationOnly uses the operating system resolver for node hostnames and URLTest probe
        hostnames, without FakeIP or an additional proxy DNS server. The application constructs
        this explicit typed policy; the compiler must not infer it from an empty JSON object.
      default_target: >-
        Carry the persisted AppState.default_target through the existing application boundary;
        reject Unconfigured, Direct, Block, absent or disabled Pool for ObservationOnly.
      next_after_approval: >-
        Specify and independently review the affected DNS compilation contract, amend only the
        approved Task scope through task-breakdown, rerun Readiness, then implement TASK-008.
      verification: >-
        Assert node and probe resolver references, exact default Pool identity, rejected empty or
        invalid inputs, and unchanged lifecycle event assertions; run declared Rust checks and
        the fixed-core final-byte checks after implementation.
      impact: >-
        TASK-008 planning/readiness and subsequent TASK-008 verification are affected.
        No accepted Requirement or frozen Design has been changed, so existing design approval
        and TASK-007 acceptance remain recorded. TASK-009 and TASK-010 cannot start.
    verification:
      implementation: NOT_RUN
