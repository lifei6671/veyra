  - id: EVIDENCE-TASK-009-CHANGE-001
    type: approved_requirement_change
    target: TASK-009
    observer: ORCHESTRATOR:/root
    approved_by: USER:lifei
    timestamp: 2026-09-04T12:24:43+08:00
    source_before: sha256:ffc2c6b1b7a018a11d8b0fdb7cbbf5430aaf6f842563f4cb2e6ba1582c25ac88
    source_after: sha256:42a61775ac324847e5a978c4af70d805d8c671150c2791315b579bd30ccd9481
    user_direction: Subscription update and sing-box configuration compilation failures only log and toast for manual retry; core startup failure interrupts service without automatically restoring old configuration, so users are not misled about latest configuration taking effect.
    accepted_semantics:
      - Subscription update failure retains valid subscription and last successful update time; user can manually retry.
      - Compilation/finalization/check failure records a redacted error and toast, without stopping an already running child or claiming the candidate took effect.
      - Core spawn/Ready failure stops and cleans the failed candidate, leaves service stopped, and never automatically restarts the old configuration.
      - Only unconfirmed process exit or resource cleanup failure retains a recovery-required state and owned resources; this is cleanup, not configuration fallback.
      - A successful subscription refresh is distinct from successful core configuration activation.
    impact:
      requirement: docs/veyra.md sections 70, 76-78 and capability summary
      designs: Foundation Build/Apply; DCR-002 runtime failure acceptance; replace proposed DCR-004 with runtime update failure design.
      current_task: TASK-009 runtime transaction, safe error outcome/log and existing UI toast.
      future_task: TASK-011 subscription update UI, manual refresh and last successful update display; do not implement a new subscription UI in TASK-009.
      data_and_dependencies: No schema/migration or dependency change in TASK-009; future subscription task must inspect existing timestamp model before any schema decision.
      contracts: Add a closed configurationFailed result to existing zero-argument Start for stage-specific feedback; no arbitrary input or new capability.
      gates_to_invalidate: TASK-009 design review and readiness; future verification must target the revised accepted semantics.
      historical_evidence: TASK-008 compiler/check delivery remains historical; its source context changes here do not establish TASK-009 runtime correctness.
    previous_candidate:
      target_identity: sha256:2ecf5c50eff3b2322794d597262d11e81a14d7b285b76d9ea30d79e3d525a8b5
      snapshot: .sdlc/evidence/TASK-009/reviewed-dcr004-001.md
      disposition: SUPERSEDED by explicit user direction; do not execute automatic rollback.
    next_action: Synchronize requirement/design and Task, independently review the revised design, then repeat readiness. The user has already authorized these product semantics.
