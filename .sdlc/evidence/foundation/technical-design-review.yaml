  - id: EVIDENCE-DESIGN-008
    type: technical_design_review
    target: .sdlc/design/foundation.md
    target_identity: sha256:2da0f1f334126d978659a0389e7a4838732cfb810667001985f81381aaa9fd0f
    produced_by_phase: ANCHORED
    command_or_method: >-
      Independent child-agent review of the macOS V0.2 source/Foundation reconciliation
      against docs/veyra.md and the user-provided macOS platform boundary guidance.
    result: PASS
    timestamp: 2026-09-03T11:30:25+08:00
    summary: >-
      PASS. Windows remains V0.1; macOS is a V0.2 DMG-direct, normal-Tauri, sing-box-
      sidecar route. No P0/P1/P2/P3 findings remain; the Human Gate is requestable.
    observer: CHILD_AGENT:/root/foundation_reviewer_macos_v02
    review:
      review_mode: CHILD_AGENT
      review_result: PASS
      coverage:
        strategy: focused_macos_v02_source_foundation_sync
        inputs:
          - docs/veyra.md
          - .sdlc/state.yaml
          - .sdlc/design/foundation.md
          - user-pasted macOS platform boundary guidance
        verified:
          - Windows is V0.1 and macOS platform realization, acceptance, and release path are V0.2 only.
          - macOS V0.2 uses DMG direct distribution, ordinary Tauri desktop capabilities, and a sing-box sidecar.
          - macOS Adapter owns Network Service System Proxy, explicit privilege, and recovery; sidecar owns utun, route, DNS, and process-routing data plane.
          - System Proxy preserves HTTP/HTTPS/SOCKS, PAC, Auto Discovery, and Exceptions through Snapshot/Managed/Observed conditional restore.
          - Long-lived Helper, SMAppService/XPC, Keychain, NetworkExtension, and rich native menu remain outside V0.2.
          - Native dependencies, Xcode Target, Entitlement, signing, and notarization still require separate approval.
      findings: []
      remaining_risks:
        - SystemConfiguration write bridging, network-service enumeration/change strategy, short-lived elevation target, and IPC require a macOS scoped Task/ADR before implementation.
        - Signing, notarization, release rollback, and real macOS Runner evidence are not run by this design review.
