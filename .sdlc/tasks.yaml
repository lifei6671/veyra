window:
  - id: TASK-009
    task_ref: .sdlc/tasks/TASK-009.md
  - id: TASK-010
    milestone_ref: M7
    objective: 验收真实受管 sidecar 的 GUI Start/Stop、脱敏观测、窗口隐藏与 Tray 恢复联合路径。
    dependencies: [TASK-009]
    risk: HIGH
    acceptance_summary: >-
      Windows GUI E2E 证明完整配置、同一受管 child、固定 loopback API、脱敏 UI 和 Tray hide/restore
      正确协作，且无控制台、System Proxy、TUN、UAC、WFP、Service 或额外 listener 变化。
  - id: TASK-011
    milestone_ref: M6
    objective: 交付订阅手动更新入口、失败日志与toast，以及最后成功更新时间展示。
    dependencies: [TASK-010]
    risk: HIGH
    acceptance_summary: >-
      订阅获取、解析、归一化或保存失败只记录脱敏日志并显示toast，不自动重试、不替换旧节点或
      停止已有core；最后成功更新时间保持不变，用户可手动重试。只有整批成功提交后才更新该时间。
      有效缓存的304完成有效更新流程后算成功检查，但不代表内容变化或运行配置已生效。
      订阅生成sing-box配置失败同样仅日志与toast，明确新配置未生效，不额外启动、停止或回滚。
