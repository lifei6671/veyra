window:
  - id: TASK-011
    task_ref: .sdlc/tasks/TASK-011.md
  - id: TASK-012
    milestone_ref: M7
    objective: 参考 Clash Verge Rev 的代理与规则页面，交付 Veyra 出口组选择和分流编辑 UI。
    dependencies: [TASK-011]
    risk: HIGH
    acceptance_summary: >-
      UI 映射现有 ProxyNode、NodePool、默认出口和 RoutePolicy，覆盖加载、空、忙碌、校验失败与保存反馈；
      不直接编辑 sing-box/Mihomo JSON，不复制参考项目 API，也不改变既有领域和 Compiler 契约。
  - id: TASK-013
    milestone_ref: M7
    objective: 参考 Clash Verge Rev 的连接、日志和设置页面，交付现有安全 DTO 的桌面 UI。
    dependencies: [TASK-012]
    risk: HIGH
    acceptance_summary: >-
      连接与日志仅展示当前实例的脱敏数据，设置只暴露已批准的应用能力；覆盖加载、空、错误、实例切换
      和大列表响应，不泄露原始目标、凭证或 API secret，不新增系统捕获、任意核心参数或权限入口。
