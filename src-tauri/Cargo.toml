[package]
name = "veyra"
version = "0.1.0"
description = "Veyra desktop client"
authors = ["Veyra Contributors"]
license = "GPL-3"
repository = "https://github.com/lifei6671/veyra.git"
default-run = "veyra"
edition = "2024"
rust-version = "1.98"

[lib]
name = "veyra_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await", "sink"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
sha2 = { version = "=0.10.9", default-features = false }
getrandom = "=0.4.3"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["process", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect"] }
tracing = "=0.1.44"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Networking_WinInet",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Memory"
] }
