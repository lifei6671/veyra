[package]
name = "veyra"
version = "0.1.0"
description = "Veyra desktop client"
authors = ["Veyra Contributors"]
license = "GPL-3"
repository = "https://github.com/lifei6671/veyra.git"
default-run = "veyra"
edition = "2024"
rust-version = "1.98"

[lib]
name = "veyra_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
tauri = { version = "=2.11.5", features = [] }
