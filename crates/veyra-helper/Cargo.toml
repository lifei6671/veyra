[package]
name = "veyra-helper-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3"
description = "Veyra restricted helper IPC and isolated P0-05 prototype"

# 保留包名避免旧命令漂移；production 与 prototype 分 feature/bin。
[features]
default = []
p0-05-prototype = []
production = ["dep:veyra-core", "dep:tokio"]

[lib]
name = "veyra_helper"
path = "src/lib.rs"

[[bin]]
name = "veyra-helper"
path = "src/production/main.rs"
required-features = ["production"]

[[bin]]
name = "veyra-helper-prototype"
path = "src/p0_05/main.rs"
required-features = ["p0-05-prototype"]

[dependencies]
tokio = { version = "=1.53.1", features = ["rt", "time", "net"], optional = true }
veyra-core = { path = "../veyra-core", optional = true }
libc = "0.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"

[build-dependencies]
cc = "1"
