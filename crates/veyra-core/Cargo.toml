[package]
name = "veyra-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3"
description = "Veyra shared business core"

# Only the legacy dev-dependency enables the existing controlled compiler fixtures.
# Normal builds retain the production configuration whitelist.
[features]
legacy-test-support = []
# P0-06 历史公网 harness；正式客户端本身无 feature gate。
p0-06-prototype = []

[dependencies]
# 日志页面有界正则与采集入口脱敏；复用 workspace 已锁定版本。
regex = "=1.13.1"
# P3-04：真实 SQLite 与 IANA 统计日期（包含夏令时）。
rusqlite = { version = "=0.40.2", features = ["bundled"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
axum = { version = "=0.8.6", default-features = false, features = ["http1", "tokio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await", "sink"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
sha2 = { version = "=0.10.9", default-features = false }
getrandom = "=0.4.3"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "time", "process"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect"] }
tracing = "=0.1.44"
# 复用已经锁定的 TLS 库校验证书/私钥匹配，不引入新的证书存储。
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }

[[example]]
name = "p0_06_outbound"
required-features = ["p0-06-prototype"]

# P0-08 独立分发探针只消费已有公开出站 builder，不进入正式服务/DTO。
[[example]]
name = "p0_08_update"
required-features = ["p0-06-prototype"]

[target.'cfg(unix)'.dependencies]
# 复用 workspace 已有 libc；恢复文件按现有 Platform 方式 O_NOFOLLOW 打开。
libc = "0.2"
