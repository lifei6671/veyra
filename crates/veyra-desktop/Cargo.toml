[package]
name = "veyra-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
qrcode = { version = "=0.14.1", default-features = false }
gpui-kit = "=0.7.0"
veyra-core = { path = "../veyra-core" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "time"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
sha2 = "=0.10.9"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
veyra-helper-prototype = { path = "../veyra-helper", features = ["production"] }
tray-icon = "=0.24.2"
libc = "0.2"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSData", "NSObject", "NSPathUtilities"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSOpenPanel", "NSSavePanel", "NSApplication", "NSImage", "NSWindow", "NSResponder", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "block2"] }
block2 = "=0.6.2"

[dev-dependencies]
# 隔离真实内核验收直接核对已锁定 SQLite 的落盘内容。
rusqlite = { version = "=0.40.2", features = ["bundled"] }
